name: Build and push images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [cron, dashboard, tinybird-local, tinybird-deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          # Railway runs amd64.
          platforms: linux/amd64
          # 9620756-r1 = OpenStatus 9620756 (2026-11-18). Before: 3fa4995 r1-r3 (r2 re-partitioned short-TTL Tinybird datasources, r3 routed the onboarding first check to the cron service).
          tags: |
            ghcr.io/${{ github.repository_owner }}/openstatus-railway-${{ matrix.image }}:9620756-r1
            ghcr.io/${{ github.repository_owner }}/openstatus-railway-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
